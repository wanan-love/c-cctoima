# 河北四大运营商个人资费采集与 IMA 同步
#
# 流程：Matrix 并发采集（四家互不影响）→ 完整性校验（失败保护旧数据）
#       → 标准化 → 与上次成功版本 diff → 有变化才更新 IMA → 提交 data/
#
# 出口网络（参考 CMCC-HE 生产方案，三级尝试）：
#   1. warp-cli TUN 模式（60s 快试）
#   2. docker 容器化 WARP（caomingjun/warp，socks5://127.0.0.1:1080）—— runner 上最稳定
#   3. 直连兜底（公示页为公开信息页；仓库变量 WARP_REQUIRED=true 可改严格模式）
#
# Secrets：
#   IMA_CLIENT_ID / IMA_API_KEY   IMA OpenAPI 凭证（官方 ima.qq.com/agent-interface）
# 变量（可选）：
#   WARP_REQUIRED=true            WARP 全失败时中止（严格模式）

name: Tariff Scrape & IMA Sync

on:
  schedule:
    - cron: '0 20 * * *' # UTC 20:00 = 北京时间次日 04:00（避开公示页白天高峰）
  workflow_dispatch:
    inputs:
      operators:
        description: '运营商：all 或逗号分隔（cmcc,cucc,ctcc,cbn）'
        required: false
        default: 'all'
      dry_run:
        description: 'DRY_RUN（采集与校验照常，不更新 IMA / 不提交 data）'
        type: boolean
        required: false
        default: false

concurrency:
  group: tariff-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── 计算本次要跑的运营商矩阵 ──
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      operators_csv: ${{ steps.set.outputs.operators_csv }}
      dry_run: ${{ steps.set.outputs.dry_run }}
    steps:
      - id: set
        run: |
          OPS="${{ github.event.inputs.operators || 'all' }}"
          if [ "$OPS" = "all" ] || [ -z "$OPS" ]; then
            MATRIX='["cmcc","cucc","ctcc","cbn"]'
          else
            MATRIX=$(echo "$OPS" | tr -d ' ' | awk -F',' '{printf "["; for(i=1;i<=NF;i++) printf "\"%s\"%s", $i, (i<NF?",":""); print "]"}')
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [ "$OPS" = "all" ] || [ -z "$OPS" ]; then
            CSV="cmcc,cucc,ctcc,cbn"
          else
            CSV=$(echo "$OPS" | tr -d ' ')
          fi
          echo "operators_csv=$CSV" >> "$GITHUB_OUTPUT"
          DR="${{ github.event.inputs.dry_run }}"
          echo "dry_run=${DR:-false}" >> "$GITHUB_OUTPUT"
          echo "operators=$MATRIX dry_run=${DR:-false}"

  # ── 并发采集（一家失败不影响其他家） ──
  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        operator: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      WARP_REQUIRED: ${{ vars.WARP_REQUIRED }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      # ── WARP 出口（TUN → docker socks5 → 直连兜底） ──
      - name: Setup WARP egress
        run: |
          set -x
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo systemctl enable --now warp-svc 2>/dev/null || sudo systemctl start warp-svc 2>/dev/null || true
          sleep 3

          warp_mode=""
          warp-cli --accept-tos registration new 2>/dev/null || warp-cli register 2>/dev/null || true
          sleep 2

          # 电信（瑞数 WAF）对 Cloudflare 出口敏感：直连优先，仅保留 docker socks 备用
          if [ "${{ matrix.operator }}" = "ctcc" ]; then
            echo "── ctcc: 直连优先模式（跳过 TUN，docker socks 仅作备用不注入）"
            docker run -d --name warp-docker -p 127.0.0.1:1080:1080               --restart unless-stopped --cap-add NET_ADMIN               --sysctl net.ipv6.conf.all.disable_ipv6=0               --sysctl net.ipv4.conf.all.src_valid_mark=1               caomingjun/warp >/dev/null 2>&1 || true
            for i in $(seq 1 60); do
              if curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace | grep -Eq '^warp=(on|plus)'; then
                echo "WARP_SOCKS=socks5://127.0.0.1:1080" >> "$GITHUB_ENV"
                echo "C2I_EGRESS=direct" >> "$GITHUB_ENV"   # 首次尝试直连（备用代理不启用）
                break
              fi
              sleep 3
            done
            echo "✅ ctcc 出口：直连优先（WARP socks5 备用可用）"
            exit 0
          fi

          # 尝试 1：TUN
          echo "── WARP 尝试 1/2: warp-cli TUN"
          warp-cli --accept-tos connect >/dev/null 2>&1 || warp-cli connect || true
          for i in $(seq 1 20); do
            if warp-cli --accept-tos status 2>/dev/null | grep -q '^Status update: Connected'; then
              if curl -s --max-time 5 https://www.cloudflare.com/cdn-cgi/trace | grep -Eq '^warp=(on|plus)'; then
                warp_mode=tun; break
              fi
            fi
            sleep 3
          done
          [ -z "$warp_mode" ] && warp-cli --accept-tos disconnect >/dev/null 2>&1 || true

          # 尝试 2：docker 容器化 WARP
          if [ -z "$warp_mode" ]; then
            echo "── WARP 尝试 2/2: docker socks5://127.0.0.1:1080"
            docker run -d --name warp-docker -p 127.0.0.1:1080:1080 \
              --restart unless-stopped --cap-add NET_ADMIN \
              --sysctl net.ipv6.conf.all.disable_ipv6=0 \
              --sysctl net.ipv4.conf.all.src_valid_mark=1 \
              caomingjun/warp >/dev/null 2>&1 || true
            for i in $(seq 1 100); do
              if curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace | grep -Eq '^warp=(on|plus)'; then
                warp_mode=docker-proxy
                echo "WARP_SOCKS=socks5://127.0.0.1:1080" >> "$GITHUB_ENV"
                break
              fi
              sleep 3
            done
          fi

          case "$warp_mode" in
            tun) echo "✅ WARP TUN 已连接" ;;
            docker-proxy) echo "✅ WARP docker 代理已连接（Chromium 走 socks5 抓取）" ;;
            *)
              echo "── WARP 诊断："
              curl -s --max-time 8 https://www.cloudflare.com/cdn-cgi/trace | head -5 || true
              docker logs warp-docker --tail 8 2>/dev/null || true
              if [ "$WARP_REQUIRED" = "true" ]; then
                echo "::error::WARP 全部失败且 WARP_REQUIRED=true，本次采集中止"
                exit 1
              fi
              echo "::warning::WARP 全部失败——直连兜底继续（公示页为公开信息页）"
              ;;
          esac

      # ── 采集（CLI 内部 2 次尝试 + 外层 1 次重跑） ──
      - name: Collect ${{ matrix.operator }}
        run: |
          set -o pipefail
          python -m collector collect --operator ${{ matrix.operator }} 2>&1 | tee collect-${{ matrix.operator }}.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::warning::第 1 次采集失败（rc=$rc），冷却 60s 后最后重试一次"
            sleep 60
            # 电信：首次直连失败 → 切换 WARP 出口重试（同步骤内 export 即时生效）
            if [ "${{ matrix.operator }}" = "ctcc" ]; then
              if curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace | grep -Eq '^warp=(on|plus)'; then
                export C2I_EGRESS=warp
                echo "── ctcc 重试出口：docker socks5"
              else
                echo "── docker socks 不可用，连接 TUN 后重试"
                warp-cli --accept-tos connect >/dev/null 2>&1 || true
                sleep 20
              fi
            fi
            python -m collector collect --operator ${{ matrix.operator }} 2>&1 | tee collect-${{ matrix.operator }}-retry.log
            rc=${PIPESTATUS[0]}
          fi
          # 输出结论（供摘要）
          python - << 'EOF' >> "$GITHUB_STEP_SUMMARY" || true
          import json, pathlib
          p = pathlib.Path('data/${{ matrix.operator }}/integrity-report.json')
          if p.exists():
            r = json.loads(p.read_text(encoding='utf-8'))
            print(f"### ${{ matrix.operator }} 采集\n")
            print(f"- 完整性: **{r['overall']}**（{r['item_count']} 条）")
            for c in r['checks']:
                icon = {'PASS': '✅', 'FAIL': '❌'}.get(c['status'], '⚠️')
                print(f"- {icon} {c['check']}: {c['detail'][:120]}")
          EOF
          exit $rc

      # 原始采集产物立即归档（if:always()：失败也保留证据链）
      - name: Upload raw data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.operator }}-${{ github.run_number }}
          path: data/${{ matrix.operator }}
          retention-days: 90
          if-no-files-found: warn

      - name: Upload collect log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.operator }}-${{ github.run_number }}
          path: collect-*.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Cleanup WARP
        if: always()
        run: |
          warp-cli --accept-tos disconnect >/dev/null 2>&1 || true
          docker rm -f warp-docker >/dev/null 2>&1 || true

  # ── 汇总：完整性闸门 → promote latest → IMA 增量同步 → 提交 data ──
  sync:
    needs: [plan, collect]
    if: always() && !cancelled() && needs.collect.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download all artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: data-*
          path: merged/
          merge-multiple: false

      - name: Merge artifacts into data/
        run: |
          mkdir -p data
          # 兼容两种 artifact 内部结构（含/不含运营商目录前缀）
          found=0
          for d in merged/data-*/; do
            [ -d "$d" ] || continue
            found=1
            op=$(basename "$d" | cut -d- -f2)
            case "$op" in
              cmcc|cucc|ctcc|cbn) ;;
              *) echo "跳过 $d"; continue ;;
            esac
            echo "合并 $op"
            mkdir -p "data/$op"
            if [ -d "$d$op" ]; then
              cp -r "$d$op"/. "data/$op"/
            else
              cp -r "$d". "data/$op"/
            fi
          done
          echo "merged=$found"
          find data -maxdepth 2 -type d | sort || true

      # ── 完整性闸门 + promote + IMA 增量同步 + 摘要 ──
      - name: Sync (integrity gate, promote latest, IMA)
        env:
          IMA_CLIENT_ID: ${{ secrets.IMA_CLIENT_ID }}
          IMA_API_KEY: ${{ secrets.IMA_API_KEY }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          OPS_CSV: ${{ needs.plan.outputs.operators_csv }}
        run: |
          set -o pipefail
          args=""
          if [ "$DRY_RUN" = "true" ]; then args="--dry-run"; fi
          python -m collector sync $args --operators "$OPS_CSV" 2>&1 | tee sync.log

      - name: Job summary
        if: always()
        run: |
          python - scripts/summary_to_markdown.py >> "$GITHUB_STEP_SUMMARY" || true
          cat sync.log 2>/dev/null | tail -30 >> "$GITHUB_STEP_SUMMARY" || true

      # ── 提交数据（latest/integrity/diff/state；完整性 FAIL 的运营商不会变化） ──
      - name: Commit data changes
        if: ${{ needs.plan.outputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: $(date -u +%Y-%m-%d) 资费采集更新 (${{ github.run_number }})"
            git push
          fi

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-${{ github.run_number }}
          path: |
            run-summary.json
            sync.log
          retention-days: 90
          if-no-files-found: warn

      - name: Final status
        if: always()
        run: |
          python - << 'EOF'
          import json, sys, pathlib
          p = pathlib.Path('run-summary.json')
          if not p.exists():
              print("::error::run-summary.json 缺失（sync 步骤失败）")
              sys.exit(1)
          s = json.loads(p.read_text(encoding='utf-8'))
          overall = s.get('overall', 'FAILED')
          print(f"总体状态: {overall}")
          if overall == 'FAILED':
              sys.exit(1)
          EOF
